{% set name = "hkl" %}
# https://repo.or.cz/hkl.git
# git rev-list --count REFERENCE
{% set version = "5.1.9.3845" %}
# Git commit hash below.  Pinning the SHA (not the tag) is the
# conda-forge convention and avoids problems with shallow clones not
# fetching tags from branches other than the remote default.
{% set git_rev = "fdde0cebe6d05c0637a07fe59d1c270bcbe46c36" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # NOTE: repo.or.cz now serves an Anubis anti-bot HTML challenge instead of
  # tarball snapshots to non-browser clients (conda-forge CI included), so the
  # tarball SHA256 churns and never matches.  Fetching via git smart-HTTP is
  # unaffected by Anubis and reproducibly delivers the source tree.
  git_url: https://repo.or.cz/hkl.git
  git_rev: {{ git_rev }}
  patches:
    # See patches/README.md for the rationale and upstream status of each patch.
    - patches/0001-ccan-configurator-build-host-binary.patch
    - patches/0002-coroutine-bump-min-stksz-for-macos.patch
    - patches/0003-make-api2-optional-on-no-ucontext.patch

build:
  number: 0
  skip: True  # [py<39]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    # On Windows, autotools_clang_conda bundles MSYS2 + clang + the
    # full autotools chain (autoconf/automake/libtool/make/m4/bash/sed
    # etc.) configured to produce MSVC-compatible binaries from
    # autoconf/automake recipes. It replaces the unix-only pieces below.
    - autotools_clang_conda  # [win]
    # Autotools toolchain runs on the build host; must be in `build:`,
    # not `host:`, so cross-builds get the build-platform-native binaries.
    - autoconf               # [unix]
    - autoconf-archive       # [unix]
    - automake               # [unix]
    - libtool                # [unix]
    - m4                     # [unix]
    - git                    # [unix]
    - make                   # [unix]
    - pkg-config             # [unix]
    # gobject-introspection ships introspection.m4 (used by
    # GOBJECT_INTROSPECTION_CHECK in configure.ac at autoreconf time) and
    # the g-ir-scanner / g-ir-compiler binaries; all run build-side.
    # Skipped on Windows for now: the introspection cross-build
    # machinery in this recipe is not yet adapted to MinGW/clang-on-win,
    # so we drop --enable-introspection on Windows and ship only the
    # libhkl DLL + headers + import lib + pkg-config file.
    - gobject-introspection  # [unix]
    # When cross-compiling, the build host also needs glib's pkg-config /
    # tools so AM_PATH_GLIB_2_0 and g-ir-scanner can resolve glib.
    - glib  # [unix and build_platform != target_platform]
    # When cross-compiling, build.sh performs a native pre-build of the
    # package (so g-ir-scanner can run a native probe binary). That
    # native build needs the same C-library deps in the build prefix:
    - gsl  # [unix and build_platform != target_platform]
    - libcblas  # [unix and build_platform != target_platform]
  host:
    - conda-verify
    - glib
    - glib-tools
    - gobject-introspection  # [unix]
    - gsl
    - libcblas
    - libglib
    # macOS libc lacks GNU libintl; conda-forge ships libintl-devel as
    # the shim.  Same applies on Windows (MSVC runtime).
    - libintl-devel  # [not linux]
    - zlib
  run:
    - gobject-introspection  # [unix]
    - libglib
    - pygobject              # [unix]

test:
  requires:
    - conda-verify
    - pip
    - python <3.12
  downstreams:
    # - hklpy  # FIXME: fails due to missing tiled package
    # hklpy2's hkl_soleil backend uses gi.repository.Hkl which we do
    # not currently ship on Windows; restrict the downstream test to
    # unix until win-64 grows introspection support.
    - hklpy2  # [unix]

about:
  home: http://repo.or.cz/w/hkl.git
  summary: Synchrotron SOLEIL library for diffractometer operations.
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: COPYING
  doc_url: https://people.debian.org/~picca/hkl/hkl.html
  dev_url: http://repo.or.cz/w/hkl.git

extra:
  recipe-maintainers:
    - mrakitin
    - prjemian
