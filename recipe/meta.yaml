{% set name = "hkl" %}
# https://repo.or.cz/hkl.git
# git rev-list --count REFERENCE
{% set version = "5.1.4.3765" %}
# Tag v5.1.4 → commit hash below.  Pinning the SHA (not the tag) is the
# conda-forge convention and avoids problems with shallow clones not
# fetching tags from branches other than the remote default.
{% set git_rev = "e4de11fc75583bee7bbac661bb6488eb95d210aa" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # NOTE: repo.or.cz now serves an Anubis anti-bot HTML challenge instead of
  # tarball snapshots to non-browser clients (conda-forge CI included), so the
  # tarball SHA256 churns and never matches.  Fetching via git smart-HTTP is
  # unaffected by Anubis and reproducibly delivers the source tree.
  git_url: https://repo.or.cz/hkl.git
  git_rev: {{ git_rev }}

build:
  number: 0
  skip: True  # [py<39 or win or osx]

requirements:
  build:
    - {{ compiler('c') }}
    - {{ stdlib('c') }}
    - autoconf
    - git
    - make
    - pkg-config
  host:
    - autoconf-archive
    - automake
    - conda-verify
    - glib
    - glib-tools
    - gobject-introspection
    - gsl
    - libcblas
    - libglib
    - libtool
    - m4
    - zlib
  run:
    - gobject-introspection
    - libglib
    - pygobject

test:
  requires:
    - conda-verify
    - pip
    - python <3.12
  downstreams:
    # - hklpy  # FIXME: fails due to missing tiled package
    - hklpy2  # does not fail

about:
  home: http://repo.or.cz/w/hkl.git
  summary: Synchrotron SOLEIL library for diffractometer operations.
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: COPYING
  doc_url: https://people.debian.org/~picca/hkl/hkl.html
  dev_url: http://repo.or.cz/w/hkl.git

extra:
  recipe-maintainers:
    - mrakitin
    - prjemian
